name: Build Octave APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout Octave
        uses: actions/checkout@v7
        with:
          submodules: false

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install required Android SDK packages
        run: |
          sdkmanager \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;22.0.7026061"

      - name: Restore UserLAndLibrary
        run: |
          rm -rf UserLAndLibrary
          git clone https://github.com/RakhithJK/UserLAndLibrary.git UserLAndLibrary

      - name: Restore Termux dependency
        run: |
          rm -rf UserLAndLibrary/termux-app-private

          git clone https://github.com/CypherpunkArmory/termux-app.git \
            UserLAndLibrary/termux-app-private

          git -C UserLAndLibrary/termux-app-private \
            checkout 087d87e02aae157310108a19525ae5bc5e4e75bc

      - name: Restore remote desktop dependency
        run: |
          rm -rf UserLAndLibrary/remote-desktop-clients-private

          git clone https://github.com/CypherpunkArmory/remote-desktop-clients.git \
            UserLAndLibrary/remote-desktop-clients-private

          git -C UserLAndLibrary/remote-desktop-clients-private \
            checkout d2598f1cc7e4af75510389ab06feb1e63fe7df3d

      - name: Fix dependency paths
        run: |
          sed -i \
            's#UserLAndLibrary/termux-app/#UserLAndLibrary/termux-app-private/#g' \
            settings.gradle

          sed -i \
            's#UserLAndLibrary/remote-desktop-clients/#UserLAndLibrary/remote-desktop-clients-private/#g' \
            settings.gradle

      - name: Add namespaces to old Android modules
        shell: bash
        run: |
          python3 <<'PY'
          import pathlib
          import re

          root = pathlib.Path(".")

          for gradle in root.rglob("build.gradle"):
              if "build" in gradle.parts or ".git" in gradle.parts:
                  continue

              text = gradle.read_text(
                  encoding="utf-8",
                  errors="ignore"
              )

              if not re.search(r"\bandroid\s*\{", text):
                  continue

              if re.search(r"(?m)^\s*namespace\s+", text):
                  continue

              manifest = (
                  gradle.parent /
                  "src/main/AndroidManifest.xml"
              )

              if not manifest.exists():
                  continue

              manifest_text = manifest.read_text(
                  encoding="utf-8",
                  errors="ignore"
              )

              match = re.search(
                  r'package\s*=\s*"([^"]+)"',
                  manifest_text
              )

              if not match:
                  continue

              namespace = match.group(1)

              text = re.sub(
                  r"\bandroid\s*\{",
                  "android {\n    namespace '%s'" % namespace,
                  text,
                  count=1
              )

              gradle.write_text(
                  text,
                  encoding="utf-8"
              )

              print(
                  "Added namespace",
                  namespace,
                  "to",
                  gradle
              )
          PY

      - name: Disable obsolete Bintray publishing
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          files = [
              Path(
                  "UserLAndLibrary/termux-app-private/"
                  "terminal-emulator/build.gradle"
              ),
              Path(
                  "UserLAndLibrary/termux-app-private/"
                  "terminal-view/build.gradle"
              ),
          ]

          for path in files:
              text = path.read_text(
                  encoding="utf-8"
              )

              # Remove the old publishing plugins block.
              text = re.sub(
                  r'\Aplugins\s*\{.*?\}\s*',
                  '',
                  text,
                  count=1,
                  flags=re.DOTALL
              )

              # Remove the old Bintray publishing script.
              text = re.sub(
                  r"(?m)^.*bintray-publish\.gradle.*\n?",
                  '',
                  text
              )

              path.write_text(
                  text,
                  encoding="utf-8"
              )

              print(
                  "Disabled obsolete Bintray publishing in",
                  path
              )
          PY

      - name: Show Gradle projects
        run: |
          chmod +x gradlew
          ./gradlew projects --no-daemon

      - name: Build debug APK
        run: |
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: Octave-Android-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
